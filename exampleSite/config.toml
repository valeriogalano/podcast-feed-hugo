baseURL = ""
languageCode = "it-it"
title = ""

# This demo site consumes the module from the repository root.
[module]
  [[module.imports]]
    path = "github.com/valeriogalano/podcast-feed-hugo"

[params]
  author = ""

  [params.podcast]
    title        = "Hugo Podcast"
    subtitle     = "Subtitle"
    summary      = "Summary"
    authors      = ["Author"]
    email        = "example@example.com"
    image        = "img/podcast-logo.png"

    # Base CDN URL for audio, images, transcripts, and chapters
    cdn_base_url = "https://cdn.example.com/podcast/"

    # Optional: URL with analytics tracking (e.g. OP3). Falls back to cdn_base_url.
    cdn_tracked_base_url = ""

    # Unique podcast GUID - generate one at https://podcastindex.org/
    guid = ""

    copyright   = "Copyright"
    category    = "Technology"
    sub_category = ""
    explicit    = "no"
    itunes_type = "episodic"   # "episodic" or "serial"

    # Update frequency (RRULE FREQ value): DAILY, WEEKLY, MONTHLY, YEARLY
    updateFrequency = "weekly"

    funding_url  = "https://example.com/funding"
    funding_text = "Buy me a coffee"

[taxonomies]
  tags = "tag"
